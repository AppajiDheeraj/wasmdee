name: ci

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tools)"
      - run: go test ./...
      - run: go test ./tools/...
      - name: Test Docker baseline source
        working-directory: benchmarks/docker
        run: go test ./...
      - name: Verify generated handler fixture
        run: |
          go run ./tools/handler-example --out /tmp/wasmdee-handler-example.wasm
          cmp examples/handler/echo.wasm /tmp/wasmdee-handler-example.wasm
      - name: Race test runtime
        run: go test -race ./internal/runtime
      - run: go build -o /tmp/wasmdee ./cmd/wasmdee

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Build frontend
        working-directory: gui/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test GUI Go package
        working-directory: gui
        run: go test ./...
