<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: "SF Mono", "Menlo", "Monaco", monospace; font-size: 54px; font-weight: 800; letter-spacing: 2px; fill: #111318; }
      .mono { font-family: "SF Mono", "Menlo", "Monaco", monospace; fill: #111318; }
      .label { font-family: "SF Mono", "Menlo", "Monaco", monospace; font-size: 23px; font-weight: 800; fill: #111318; }
      .small { font-family: "SF Mono", "Menlo", "Monaco", monospace; font-size: 17px; font-weight: 650; fill: #4d4b62; }
      .tiny { font-family: "SF Mono", "Menlo", "Monaco", monospace; font-size: 13px; font-weight: 650; fill: #65627b; }
      .outline { stroke: #5b5593; stroke-width: 4; stroke-linejoin: round; }
      .thin { stroke: #706aa7; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #5f58d8; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 13 15; }
      .arrow { stroke: #1258f2; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3b3568" flood-opacity="0.18"/>
    </filter>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L13 8 L2 14 Z" fill="#1258f2"/>
    </marker>
    <marker id="purpleArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#5f58d8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f4e9"/>
  <rect width="1600" height="900" filter="url(#paperNoise)" opacity="0.65"/>

  <text x="800" y="88" text-anchor="middle" class="title">WASMDEE SERVERLESS FASTPATH</text>
  <text x="800" y="128" text-anchor="middle" class="small">single process wasm data plane with measured cold, rehydrate, and warm paths</text>

  <!-- event sources -->
  <g filter="url(#softShadow)">
    <path d="M95 264 L210 206 L350 270 L235 334 Z" fill="#d8d3ff" class="outline"/>
    <path d="M95 264 L235 334 L235 485 L95 414 Z" fill="#b7aef0" class="outline"/>
    <path d="M235 334 L350 270 L350 421 L235 485 Z" fill="#9b91dd" class="outline"/>
    <rect x="134" y="314" width="76" height="98" rx="8" fill="#f9f7ff" class="thin"/>
    <path d="M150 337 H194 M150 360 H190 M150 383 H183" class="thin"/>
    <rect x="247" y="330" width="66" height="70" rx="9" fill="#f9f7ff" class="thin"/>
    <path d="M260 350 H300 M260 370 H292" class="thin"/>
  </g>
  <text x="222" y="535" text-anchor="middle" class="label">EVENTS</text>
  <text x="222" y="562" text-anchor="middle" class="small">HTTP, CLI, GUI</text>

  <!-- control plane chip -->
  <g filter="url(#softShadow)">
    <path d="M455 242 L650 242 L710 302 L710 465 L515 465 L455 405 Z" fill="#e8e6ff" class="outline"/>
    <path d="M455 242 L515 302 L710 302 L650 242 Z" fill="#f4f1ff" class="outline"/>
    <path d="M455 242 L515 302 L515 465 L455 405 Z" fill="#c7c0f3" class="outline"/>
    <rect x="546" y="330" width="118" height="78" rx="11" fill="#fffdf7" class="thin"/>
    <path d="M562 354 H642 M562 377 H625 M562 399 H650" class="thin"/>
    <circle cx="500" cy="286" r="9" fill="#6fe7c1" stroke="#5b5593" stroke-width="3"/>
    <circle cx="675" cy="286" r="9" fill="#ffe176" stroke="#5b5593" stroke-width="3"/>
  </g>
  <text x="584" y="535" text-anchor="middle" class="label">DEPLOY CONTROL</text>
  <text x="584" y="562" text-anchor="middle" class="small">YAML, routes, registry, module store</text>

  <!-- gateway slab -->
  <g filter="url(#softShadow)">
    <path d="M820 262 L1018 262 L1074 314 L1074 452 L876 452 L820 400 Z" fill="#cfd9ff" class="outline"/>
    <path d="M820 262 L876 314 L1074 314 L1018 262 Z" fill="#eef2ff" class="outline"/>
    <path d="M820 262 L876 314 L876 452 L820 400 Z" fill="#9eb1fb" class="outline"/>
    <path d="M910 345 H1030 M910 382 H1015 M910 419 H992" class="thin"/>
    <circle cx="862" cy="292" r="8" fill="#1258f2"/>
    <circle cx="890" cy="292" r="8" fill="#6fe7c1"/>
    <circle cx="918" cy="292" r="8" fill="#ffe176"/>
  </g>
  <text x="948" y="535" text-anchor="middle" class="label">GATEWAY + DISPATCHER</text>
  <text x="948" y="562" text-anchor="middle" class="small">route lookup, bounded queue, worker autoscale</text>

  <!-- engine large chip -->
  <g filter="url(#softShadow)">
    <path d="M1194 222 L1442 222 L1505 285 L1505 486 L1257 486 L1194 423 Z" fill="#d8d2ff" class="outline"/>
    <path d="M1194 222 L1257 285 L1505 285 L1442 222 Z" fill="#f2efff" class="outline"/>
    <path d="M1194 222 L1257 285 L1257 486 L1194 423 Z" fill="#a89ee6" class="outline"/>
    <rect x="1296" y="318" width="154" height="104" rx="13" fill="#fffdf7" class="thin"/>
    <path d="M1320 344 H1427 M1320 370 H1403 M1320 396 H1432" class="thin"/>
    <path d="M1226 451 H1480" stroke="#5b5593" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 15"/>
    <path d="M1248 512 H1472" stroke="#5b5593" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 15"/>
  </g>
  <text x="1350" y="535" text-anchor="middle" class="label">WAZERO ENGINE</text>
  <text x="1350" y="562" text-anchor="middle" class="small">warm compiled module, fresh memory instance</text>

  <!-- arrows -->
  <path d="M350 355 C390 355 416 355 455 355" class="arrow" marker-end="url(#blueArrow)"/>
  <path d="M710 355 C756 355 781 355 820 355" class="arrow" marker-end="url(#blueArrow)"/>
  <path d="M1074 355 C1125 355 1150 355 1194 355" class="arrow" marker-end="url(#blueArrow)"/>

  <!-- data plane bottom labels -->
  <g>
    <rect x="382" y="656" width="238" height="74" rx="18" fill="#fffdf7" stroke="#706aa7" stroke-width="3"/>
    <text x="501" y="688" text-anchor="middle" class="label" font-size="20">SQLite Registry</text>
    <text x="501" y="714" text-anchor="middle" class="tiny">function, route, URL, controls</text>

    <rect x="684" y="656" width="238" height="74" rx="18" fill="#fffdf7" stroke="#706aa7" stroke-width="3"/>
    <text x="803" y="688" text-anchor="middle" class="label" font-size="20">Module Store</text>
    <text x="803" y="714" text-anchor="middle" class="tiny">sha256.wasm content address</text>

    <rect x="988" y="656" width="238" height="74" rx="18" fill="#fffdf7" stroke="#706aa7" stroke-width="3"/>
    <text x="1107" y="688" text-anchor="middle" class="label" font-size="20">Telemetry</text>
    <text x="1107" y="714" text-anchor="middle" class="tiny">latency, queue, worker, errors</text>
  </g>

  <path d="M584 465 C575 540 552 595 501 656" class="dash" marker-end="url(#purpleArrow)"/>
  <path d="M584 465 C632 540 706 595 803 656" class="dash" marker-end="url(#purpleArrow)"/>
  <path d="M948 452 C968 540 1019 604 1107 656" class="dash" marker-end="url(#purpleArrow)"/>
  <path d="M1350 486 C1320 570 1220 620 1107 656" class="dash" marker-end="url(#purpleArrow)"/>

  <!-- future lane -->
  <g opacity="0.95">
    <rect x="238" y="778" width="1124" height="54" rx="27" fill="#15131f"/>
    <text x="800" y="813" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="22" font-weight="800" fill="#fffdf7">
      NEXT MILESTONE: HANDLER ABI -> PROTO-FAASLET TEMPLATE -> SNAPSHOT / COW RESTORE
    </text>
  </g>

  <!-- callout pins -->
  <path d="M1238 170 C1274 151 1328 150 1365 172" class="thin"/>
  <text x="1300" y="151" text-anchor="middle" class="tiny">implemented: compile cache + fresh instance isolation</text>
  <path d="M875 200 C900 180 970 177 1007 199" class="thin"/>
  <text x="942" y="176" text-anchor="middle" class="tiny">queue full returns 429 instead of melting the node</text>
</svg>
